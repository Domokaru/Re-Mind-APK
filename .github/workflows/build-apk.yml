name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pre-accept Android SDK Licenses & Configure SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a532e3034293298e12b7d52a19f\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "85642a38d148c4f9f80a93590218702ff4349c8d\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "601085b94cd77f0b54ff86406957099fed7926d4\n" > "$ANDROID_HOME/licenses/android-googletv-license"
          printf "33b6a2b6492218415c21373550289c6c0e5d1f67\n" > "$ANDROID_HOME/licenses/google-gdk-license"
          printf "e9acab5b5f1556e4dec5ca3658042d118c30e5d5\n" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug & Release APK
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon
          else
            gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remind-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
